<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .user-icon img {
            border-radius: 50%;
            height: 60px;
            width: 60px;
        }

        h1 {
            margin: 10px 0;
        }

        p {
            margin: 5px 0;
        }

        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="user-icon">
            <img src="./assert/user-profile.png" alt="User Icon">
        </div>
        <h1>Nithin Kumar</h1>
        <p>Age: 19</p>
        <p>Weight: 75 kg</p>
        <p>Height: 190 cm</p>
        <p>BMI: 21.6</p>
        <a href="landingpage.html" class="btn">Back to Home</a>
    </div>
</body>
</html>
