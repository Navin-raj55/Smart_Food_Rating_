<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Food Rating</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #89f7fe, #66a6ff);
            position: relative;
            overflow: hidden;
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 10px rgba(0, 0, 255, 0.7);
            }
            20% {
                box-shadow: 0 0 10px rgba(100, 230, 98, 0.7);
            }
            40% {
                box-shadow: 0 0 10px rgba(0, 255, 0, 0.7);
            }
            60% {
                box-shadow: 0 0 10px rgba(238, 130, 238, 0.7);
            }
            80% {
                box-shadow: 0 0 10px rgba(0, 255, 255, 0.7);
            }
            100% {
                box-shadow: 0 0 10px rgba(0, 0, 255, 0.7);
            }
        }

        .container {
            background-color: rgba(255, 255, 255, 1);
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            position: relative;
            max-width: 350px;
            width: 100%;
            z-index: 2;
            animation: glow 5s infinite;
        }

        .container h2 {
            text-align: center;
            margin-top: -25px;
            margin-bottom: 35px;
            color: #333;
            font-size: 24px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 14px;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            background-color: #007bff;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 15px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0056b3;
        }

        .forgot-password {
            text-align: center;
            margin-bottom: 15px;
        }

        .forgot-password a {
            color: #007bff;
            text-decoration: none;
        }

        .have-account {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #666;
        }

        .have-account a {
            color: #007bff;
            text-decoration: none;
        }

        /* Floating circles animation */
        .floating-circle {
            position: absolute;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            animation: float 10s infinite ease-in-out;
            pointer-events: none; /* Prevent mouse events on floating circles */
        }

        .floating-circle:nth-child(1) {
            width: 150px;
            height: 150px;
            top: -50px;
            left: 20%;
            animation-duration: 8s;
        }

        .floating-circle:nth-child(2) {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: 20%;
            animation-duration: 12s;
        }

        .floating-circle:nth-child(3) {
            width: 100px;
            height: 100px;
            top: 10%;
            right: 10%;
            animation-duration: 10s;
        }

        .floating-circle:nth-child(4) {
            width: 120px;
            height: 120px;
            bottom: 15%;
            left: 15%;
            animation-duration: 14s;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-30px);
            }
            100% {
                transform: translateY(0px);
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
                max-width: 300px;
            }

            form {
                margin-left: 35px;
                margin-top: -10px;
            }

            button {
                padding: 10px;
            }

            input[type="email"],
            input[type="password"] {
                padding: 8px;
                font-size: 13px;
                width: 90%;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
                max-width: 75%;
            }

            button {
                padding: 8px;
                font-size: 14px;
                width: 90%;
                border-radius: 30px;
            }

            input[type="email"],
            input[type="password"] {
                padding: 7px;
                font-size: 12px;
                width: 90%;
            }
        }
    </style>
</head>

<body>
    <!-- Floating circles for interactive background -->
    <div class="floating-circle"></div>
    <div class="floating-circle"></div>
    <div class="floating-circle"></div>
    <div class="floating-circle"></div>

    <div class="container">
        <!-- Logo image added here -->
        <img src="./assert/logo.png" alt="Logo" style="display: block; margin: 0 auto 15px; max-width: 150px;margin-bottom: 0px; margin-top: -50px;">

        <h2 style="color: #007bff;">SMART FOOD RATING</h2>
        <form action="login.php" method="POST">
            <input type="email" name="email" placeholder="Email" required>
            <input type="password" name="password" placeholder="Password" required>

            <button type="submit">SIGN IN</button>
        </form>
        <div class="have-account">
            <a href="create.html">Create a new account</a>
        </div>
    </div>
</body>

</html>
